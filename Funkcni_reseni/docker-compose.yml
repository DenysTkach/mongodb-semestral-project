      chmod 400 /etc/mongo-keyfile &&
      chown mongodb:mongodb /etc/mongo-keyfile &&
      exec mongos --config /etc/mongo/mongos.conf
      "
    ports:
      - "${MONGOS_PORT}:27017"
    volumes:
      - mongo_keyfile:/run/secrets:ro
      - ./config/mongos.conf:/etc/mongo/mongos.conf:ro
      - ../Data/processed:/import:ro
      - ./scripts/mongo:/workspace/scripts/mongo:ro
    networks:
      - mongo-cluster

  cluster-setup:
    image: docker:28-cli
    container_name: mongo-cluster-setup
    depends_on:
      - configsvr01
      - configsvr02
      - configsvr03
      - shard01a
      - shard01b
      - shard01c
      - shard02a
      - shard02b
      - shard02c
      - shard03a
      - shard03b
      - shard03c
      - mongos
    command: ["sh", "/workspace/scripts/auto-setup.sh"]
    restart: "no"
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_DB: ${MONGO_APP_DB}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/workspace/scripts:ro
    networks:
      - mongo-cluster


  mongos:
    image: mongo:${MONGO_IMAGE_TAG}
    container_name: mongos-router
    hostname: mongos
    depends_on:
      - configsvr01
      - configsvr02
      - configsvr03
      - shard01a
      - shard01b
      - shard01c
      - shard02a
      - shard02b

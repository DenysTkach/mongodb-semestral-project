x-mongo-common: &mongo-common
  image: mongo:${MONGO_IMAGE_TAG:-8.0.20}
  networks:
    - mongo-cluster

x-configsvr-common: &configsvr-common
  <<: *mongo-common
  command: >
    bash -lc "
    until [ -s /run/secrets/mongo-keyfile ]; do sleep 1; done &&
    cp /run/secrets/mongo-keyfile /etc/mongo-keyfile &&
    chmod 400 /etc/mongo-keyfile &&
    chown mongodb:mongodb /etc/mongo-keyfile &&
    exec mongod --config /etc/mongo/mongod-configsvr.conf
    "

x-shard01-common: &shard01-common
  <<: *mongo-common
  command: >
    bash -lc "
    until [ -s /run/secrets/mongo-keyfile ]; do sleep 1; done &&
    cp /run/secrets/mongo-keyfile /etc/mongo-keyfile &&
    chmod 400 /etc/mongo-keyfile &&
    chown mongodb:mongodb /etc/mongo-keyfile &&
    exec mongod --config /etc/mongo/mongod-shard.conf --replSet shard01rs
    "

x-shard02-common: &shard02-common
  <<: *mongo-common
  command: >
    bash -lc "
    until [ -s /run/secrets/mongo-keyfile ]; do sleep 1; done &&
    cp /run/secrets/mongo-keyfile /etc/mongo-keyfile &&
    chmod 400 /etc/mongo-keyfile &&
    chown mongodb:mongodb /etc/mongo-keyfile &&
    exec mongod --config /etc/mongo/mongod-shard.conf --replSet shard02rs
    "

x-shard03-common: &shard03-common
  <<: *mongo-common
  command: >
    bash -lc "
    until [ -s /run/secrets/mongo-keyfile ]; do sleep 1; done &&
    cp /run/secrets/mongo-keyfile /etc/mongo-keyfile &&
    chmod 400 /etc/mongo-keyfile &&
    chown mongodb:mongodb /etc/mongo-keyfile &&
    exec mongod --config /etc/mongo/mongod-shard.conf --replSet shard03rs
    "

services:
  keyfile-setup:
    <<: *mongo-common
    container_name: mongo-keyfile-setup
    command: >
      bash -lc "
      if [ ! -s /keyfile/mongo-keyfile ]; then
        umask 177 &&
        dd if=/dev/urandom bs=756 count=1 2>/dev/null | base64 > /keyfile/mongo-keyfile;
      fi &&
      chmod 400 /keyfile/mongo-keyfile
      "
    volumes:
      - mongo_keyfile:/keyfile
    restart: "no"

  configsvr01:
    <<: *configsvr-common
    container_name: configsvr01
    hostname: configsvr01
    volumes:
      - configsvr01_data:/data/db
      - mongo_keyfile:/run/secrets:ro
      - ./config/mongod-configsvr.conf:/etc/mongo/mongod-configsvr.conf:ro

  configsvr02:
    <<: *configsvr-common
    container_name: configsvr02
    hostname: configsvr02
    volumes:
      - configsvr02_data:/data/db
      - mongo_keyfile:/run/secrets:ro
      - ./config/mongod-configsvr.conf:/etc/mongo/mongod-configsvr.conf:ro

  configsvr03:
    <<: *configsvr-common
    container_name: configsvr03
    hostname: configsvr03
    volumes:
      - configsvr03_data:/data/db
      - mongo_keyfile:/run/secrets:ro
      - ./config/mongod-configsvr.conf:/etc/mongo/mongod-configsvr.conf:ro

  shard01a:
    <<: *shard01-common
    container_name: shard01a
    hostname: shard01a
    volumes:
      - shard01a_data:/data/db
      - mongo_keyfile:/run/secrets:ro
      - ./config/mongod-shard.conf:/etc/mongo/mongod-shard.conf:ro

  shard01b:
    <<: *shard01-common
    container_name: shard01b
    hostname: shard01b
    volumes:
      - shard01b_data:/data/db
      - mongo_keyfile:/run/secrets:ro
      - ./config/mongod-shard.conf:/etc/mongo/mongod-shard.conf:ro

  shard01c:
    <<: *shard01-common
    container_name: shard01c
    hostname: shard01c
    volumes:
      - shard01c_data:/data/db
      - mongo_keyfile:/run/secrets:ro
      - ./config/mongod-shard.conf:/etc/mongo/mongod-shard.conf:ro

  shard02a:
    <<: *shard02-common
    container_name: shard02a
    hostname: shard02a
    volumes:
      - shard02a_data:/data/db
      - mongo_keyfile:/run/secrets:ro
      - ./config/mongod-shard.conf:/etc/mongo/mongod-shard.conf:ro

  shard02b:
    <<: *shard02-common
    container_name: shard02b
    hostname: shard02b
    volumes:
      - shard02b_data:/data/db
      - mongo_keyfile:/run/secrets:ro
      - ./config/mongod-shard.conf:/etc/mongo/mongod-shard.conf:ro

  shard02c:
    <<: *shard02-common
    container_name: shard02c
    hostname: shard02c
    volumes:
      - shard02c_data:/data/db
      - mongo_keyfile:/run/secrets:ro
      - ./config/mongod-shard.conf:/etc/mongo/mongod-shard.conf:ro

  shard03a:
    <<: *shard03-common
    container_name: shard03a
    hostname: shard03a
    volumes:
      - shard03a_data:/data/db
      - mongo_keyfile:/run/secrets:ro
      - ./config/mongod-shard.conf:/etc/mongo/mongod-shard.conf:ro

  shard03b:
    <<: *shard03-common
    container_name: shard03b
    hostname: shard03b
    volumes:
      - shard03b_data:/data/db
      - mongo_keyfile:/run/secrets:ro
      - ./config/mongod-shard.conf:/etc/mongo/mongod-shard.conf:ro

  shard03c:
    <<: *shard03-common
    container_name: shard03c
    hostname: shard03c
    volumes:
      - shard03c_data:/data/db
      - mongo_keyfile:/run/secrets:ro
      - ./config/mongod-shard.conf:/etc/mongo/mongod-shard.conf:ro

  mongos:
    <<: *mongo-common
    container_name: mongos-router
    hostname: mongos
    depends_on:
      - configsvr01
      - configsvr02
      - configsvr03
      - shard01a
      - shard01b
      - shard01c
      - shard02a
      - shard02b
      - shard02c
      - shard03a
      - shard03b
      - shard03c
    command: >
      bash -lc "
      until [ -s /run/secrets/mongo-keyfile ]; do sleep 1; done &&
      cp /run/secrets/mongo-keyfile /etc/mongo-keyfile &&
      chmod 400 /etc/mongo-keyfile &&
      chown mongodb:mongodb /etc/mongo-keyfile &&
      exec mongos --config /etc/mongo/mongos.conf
      "
    ports:
      - "${MONGOS_PORT:-27030}:27017"
    volumes:
      - mongo_keyfile:/run/secrets:ro
      - ./config/mongos.conf:/etc/mongo/mongos.conf:ro
      - ../Data/processed:/import:ro
      - ./scripts/mongo:/workspace/scripts/mongo:ro

  cluster-setup:
    image: docker:28-cli
    container_name: mongo-cluster-setup
    depends_on:
      - configsvr01
      - configsvr02
      - configsvr03
      - shard01a
      - shard01b
      - shard01c
      - shard02a
      - shard02b
      - shard02c
      - shard03a
      - shard03b
      - shard03c
      - mongos
    command: ["sh", "/workspace/scripts/auto-setup.sh"]
    restart: "no"
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
      MONGO_APP_DB: ${MONGO_APP_DB:-statsbomb}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-statsbomb_user}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-statsbomb_pass123}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/workspace/scripts:ro
    networks:
      - mongo-cluster

volumes:
  mongo_keyfile:
  configsvr01_data:
  configsvr02_data:
  configsvr03_data:
  shard01a_data:
  shard01b_data:
  shard01c_data:
  shard02a_data:
  shard02b_data:
  shard02c_data:
  shard03a_data:
  shard03b_data:
  shard03c_data:

networks:
  mongo-cluster:
    name: mongo-cluster
